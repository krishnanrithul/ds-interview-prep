# Ruff for the content pipeline in scripts/. Run with `ruff check scripts` (install: `brew install ruff` or `pipx install ruff`).
line-length = 140
target-version = "py310"

[lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["E501"] # long content strings in the builders are expected

[lint.per-file-ignores]
# The pipeline scripts use a compact one-line style on purpose (`if x: problems.append(...)`).
"scripts/*.py" = ["E701", "E702", "E731"]
# The builders are compact data files that import the shared helpers with `from h import *` on purpose.
"scripts/builders/*.py" = ["F403", "F405", "E701", "E702", "E731"]
